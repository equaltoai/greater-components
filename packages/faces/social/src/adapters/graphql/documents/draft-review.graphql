# Shared-draft review operations (Lesser review contract, LESSER_REF v1.6.4)
#
# Selection is scoped to exactly what the review chrome renders
# (Review.QueueCard / Review.AttributionStrip / Review.VerdictActions), so the
# queue list stays cheap and the generated types stay narrow.

fragment ReviewActorFields on Actor {
	id
	username
	domain
	displayName
	avatar
	isAgent
}

fragment DraftReviewFields on DraftReview {
	draftId
	ownerId
	title
	slug
	content
	renderedHtml
	renderErrors
	subtitle
	excerpt
	contentFormat
	status
	scheduledAt
	updatedAt
	createdAt
	reviewStatus
	editorNotes
	contentHash
	revision
	activeReviewerIds
	publishEligible
	publishBlockingReasons
	reviewersApproved
	principalApprovalRequired
	principalApproved
	grantCount
	grantsTruncated
	generatedBy {
		...ReviewActorFields
	}
	reviewedBy {
		...ReviewActorFields
	}
	grant {
		reviewerId
		grantedAt
		status
		revokedAt
		reviewer {
			...ReviewActorFields
		}
	}
	grants {
		reviewerId
		grantedAt
		status
		revokedAt
		reviewer {
			...ReviewActorFields
		}
	}
	verdicts {
		verdict
		notes
		contentHash
		reviewerId
		recordedAt
		current
		stale
		reviewer {
			...ReviewActorFields
		}
	}
	publishEligibility {
		eligible
		blockingReasons
		reviewersApproved
		principalApprovalRequired
		principalApproved
	}
}

query SharedDraftReviews($first: Int, $after: Cursor) {
	sharedDraftReviews(first: $first, after: $after) {
		totalCount
		pageInfo {
			hasNextPage
			endCursor
		}
		edges {
			cursor
			node {
				...DraftReviewFields
			}
		}
	}
}

query DraftReview($id: ID!) {
	draftReview(id: $id) {
		...DraftReviewFields
	}
}

mutation ShareDraftForReview($draftId: ID!, $reviewer: String!) {
	shareDraftForReview(draftId: $draftId, reviewer: $reviewer) {
		...DraftReviewFields
	}
}

mutation RevokeDraftReview($draftId: ID!, $reviewer: String!) {
	revokeDraftReview(draftId: $draftId, reviewer: $reviewer)
}

mutation SubmitDraftReview($draftId: ID!, $verdict: DraftReviewVerdict!, $notes: String) {
	submitDraftReview(draftId: $draftId, verdict: $verdict, notes: $notes) {
		...DraftReviewFields
	}
}
