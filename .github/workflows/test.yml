name: Test

on:
  pull_request:
    branches: [staging]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Check out the immutable PR head SHA (pull_request events default to the
      # refs/pull merge SHA, which is not the commit under review).
      - name: Checkout repository (immutable PR head)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out HEAD is the exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          if [ -z "$EXPECTED_HEAD" ] || [ "$ACTUAL_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "::error::Checked out $ACTUAL_HEAD; expected immutable head $EXPECTED_HEAD. Failing instead of validating a merge SHA."
            exit 1
          fi
          echo "Checked out exact head $ACTUAL_HEAD"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Audit lockfile integrity
        run: pnpm audit:lockfile-integrity

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit release tarball integrity
        run: pnpm audit:tarball-integrity

      - name: Build packages
        run: pnpm build

      - name: Validate packages
        run: pnpm validate:package

      - name: Validate generator replay (zero diff)
        run: pnpm check:generator-replay

      - name: Validate Registry (Strict)
        run: |
          if ! pnpm validate:registry; then
            echo "::error::Registry validation failed. Please run 'pnpm generate-registry' locally and commit the changes."
            exit 1
          fi

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run script tests
        run: pnpm test:scripts

      - name: Run agent face smoke coverage
        run: pnpm smoke:agent-face

      - name: Build Storybook
        run: |
          if [ -d "apps/playground" ] && [ -f "apps/playground/package.json" ]; then
            pnpm --filter playground build-storybook
          fi

      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
