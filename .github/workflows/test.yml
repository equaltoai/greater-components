name: Test

on:
  pull_request:
    branches: [staging]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Audit lockfile integrity
        run: pnpm audit:lockfile-integrity

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit release tarball integrity
        run: pnpm audit:tarball-integrity

      - name: Build packages
        run: pnpm build

      - name: Validate packages
        run: pnpm validate:package

      - name: Validate Registry (Strict)
        run: |
          if ! pnpm validate:registry; then
            echo "::error::Registry validation failed. Please run 'pnpm generate-registry' locally and commit the changes."
            exit 1
          fi

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run script tests
        run: pnpm test:scripts

      - name: Run agent face smoke coverage
        run: pnpm smoke:agent-face

      - name: Build Storybook
        run: |
          if [ -d "apps/playground" ] && [ -f "apps/playground/package.json" ]; then
            pnpm --filter playground build-storybook
          fi

      - name: Upload coverage reports
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
