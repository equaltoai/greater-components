name: Lint

on:
  pull_request:
    branches: [staging]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ESLint and Prettier Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check Prettier formatting
        run: pnpm format:check

      - name: TypeScript type checking
        run: pnpm typecheck

      - name: Svelte component type checking
        run: pnpm check:svelte

      - name: Audit svelte-check parity (every Svelte-containing package is gated)
        run: node scripts/audit-svelte-check-parity.mjs

      - name: Audit CLI package-enumeration parity (every top-level package enumerated in CLI sites)
        run: node scripts/audit-cli-package-enumeration-parity.mjs

      - name: Consumer TypeScript checks
        run: pnpm typecheck:consumer

      - name: CSP Compliance Check
        run: pnpm validate:csp
