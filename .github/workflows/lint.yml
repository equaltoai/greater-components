name: Lint

on:
  pull_request:
    branches: [staging]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ESLint and Prettier Check
    runs-on: ubuntu-latest

    steps:
      # Check out the immutable PR head SHA (pull_request events default to the
      # refs/pull merge SHA, which is not the commit under review).
      - name: Checkout repository (immutable PR head)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out HEAD is the exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          if [ -z "$EXPECTED_HEAD" ] || [ "$ACTUAL_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "::error::Checked out $ACTUAL_HEAD; expected immutable head $EXPECTED_HEAD. Failing instead of validating a merge SHA."
            exit 1
          fi
          echo "Checked out exact head $ACTUAL_HEAD"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Audit lockfile integrity
        run: pnpm audit:lockfile-integrity

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit release tarball integrity
        run: pnpm audit:tarball-integrity

      - name: Run ESLint
        run: pnpm lint

      - name: Check Prettier formatting
        run: pnpm format:check

      - name: TypeScript type checking
        run: pnpm typecheck

      - name: Svelte component type checking
        run: pnpm check:svelte

      - name: Audit svelte-check parity (every Svelte-containing package is gated)
        run: node scripts/audit-svelte-check-parity.mjs

      - name: Audit CLI package-enumeration parity (every top-level package enumerated in CLI sites)
        run: node scripts/audit-cli-package-enumeration-parity.mjs

      - name: Consumer TypeScript checks
        run: pnpm typecheck:consumer

      - name: CSP Compliance Check
        run: pnpm validate:csp
