name: Governance Rubric

on:
  pull_request:
    branches: [staging]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rubric:
    name: Governance Rubric
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_A11Y_USE_SYSTEM_CHROME: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Build FaceTheory example
        run: pnpm build:facetheory-example
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(
            node -e "const { createRequire } = require('node:module'); const fromTesting = createRequire(process.cwd() + '/package.json'); process.stdout.write(fromTesting('@playwright/test/package.json').version);"
          )"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Playwright version: ${version}"
        working-directory: packages/testing
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-
      # Authenticate GitHub API calls made by CLI ref-pinning code under test;
      # unauthenticated calls rate-limit on shared runner egress IPs (#897 tracks
      # the steward-level fix: mock the network in the update-command unit tests).
      - run: bash gov-infra/verifiers/gov-verify-rubric.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gov-rubric-evidence
          path: gov-infra/evidence/
