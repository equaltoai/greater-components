name: DCO Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # No workflow_dispatch: the manual-dispatch path existed solely for the retired
  # release-please flow (155/155 dispatch runs were on release-please branches;
  # the last, 2026-06-18, predates the two-branch feature -> staging -> main
  # model). It accepted an operator-supplied base_ref, fetched it, and executed
  # scripts/check-dco.js from that ref, which CodeQL flagged as
  # actions/cache-poisoning/poisonable-step (#139/#140) in the default-branch
  # context. Removing the trigger removes the vulnerable pattern; the PR path
  # below remains the single, least-privilege DCO gate. Manual checks stay
  # available locally: node scripts/check-dco.js --base origin/staging

permissions:
  contents: read

jobs:
  dco:
    name: DCO Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Fetch pull request refs
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --prune origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" \
            "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pull/${{ github.event.pull_request.number }}/head"

      - name: DCO Check (pull_request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          # CSR-036: Use base ref's check-dco.js to prevent PR-controlled bypass.
          # The PR branch's version of the script must not be the one that judges
          # whether commits are signed off.
          git checkout "${BASE_REF}" -- scripts/check-dco.js
          node scripts/check-dco.js --base "${BASE_REF}" --head "${HEAD_REF}"
